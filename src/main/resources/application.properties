spring.application.name=logistica-gps

# ===============================
# Configuración de Base de Datos (NUBE - Clever Cloud)
# ===============================
spring.datasource.url=jdbc:mysql://[HOST_DE_CLEVER_CLOUD]:3306/[DATABASE_NAME]?serverTimezone=UTC&useSSL=false
spring.datasource.username=[USER_DE_CLEVER_CLOUD]
spring.datasource.password=[PASSWORD_DE_CLEVER_CLOUD]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Configuración de JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===============================
# Puerto del servidor Backend
# ===============================
server.port=8080
